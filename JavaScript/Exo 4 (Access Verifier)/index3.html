<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script3.js" defer></script>
    <title>Document</title>
</head>

<body>
    <h1>Access Control Checker</h1>

    <label for="habilitation">Niveau d'habilitation :</label>
    <br>
    <input type="number" id="habilitation" min="1" max="5" placeholder="ex: 4">

    <br><br>

    <label for="statut">Cochez cette case si votre badge est actif </label>
    <input type="checkbox" id="statut">

    <br><br>

    <label for="arrival">Veuillez entrer l'heure actuelle :</label>
    <br>
    <input type="number" id="arrival" min="0" max="23">

    <br><br>    

    <button id="btn"> Demander l'accès </button>
    <br><br>

    <p id="access"></p>
    <p id="reason"></p>
</body>
</html>
