<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Pokédex</title>
</head>

<body>
    <h1>Recherche ton pokémon !</h1>

    <form id="form" name="pokeform">
        <label for="name-number">Nom du pokémon : </label>
        <input id="name-number" type="text" placeholder="Ex: salamèche ou 36" required>
        <br><br>
        <button id="submit" type="submit">Rechercher</button>
    </form>

    <br><br>
    <div class="pokemon-card"></div>

    <p id="error-message"></p>
</body>
</html>
