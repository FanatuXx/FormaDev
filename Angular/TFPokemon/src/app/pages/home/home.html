@if(pokemonIsLoading()) {
    <app-loader></app-loader>
} @else {
    <div>
        <input #pokemonInput>
        <button (click)="pokemonName.set(pokemonInput.value)">Charger un autre pokemon</button>
    </div>
    <p> 
        <img [src]="pokemon()!.sprites.front_default" alt="">
        <img [src]="pokemon()!.sprites.back_default" alt="">
    </p>  
}
